<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVDH Viewer</title>
<style>
body{
  margin:0;
  background:#2f2118;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  padding:24px;
}
.viewer{
  max-width:1100px;
  margin:0 auto;
}
.header{
  text-align:center;
  margin-bottom:24px;
}
.title{
  font-size:18px;
  font-weight:700;
  letter-spacing:.08em;
  opacity:.8;
}
.imageWrap{
  margin-bottom:24px;
  background:#463426;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:12px;
}
.imageWrap img{
  display:block;
  width:100%;
  height:auto;
  border-radius:12px;
  background:white;
  pointer-events:none;
  -webkit-user-drag:none;
  user-select:none;
}
.pageLabel{
  font-size:13px;
  color:rgba(255,255,255,.6);
  margin:0 0 10px 4px;
}
.empty{
  text-align:center;
  padding:80px 20px;
  color:rgba(255,255,255,.65);
}
</style>
</head>
<body oncontextmenu="return false;">

<div class="viewer">
  <div class="header">
    <div class="title">RVDH DOCUMENT VIEWER</div>
  </div>

  <div id="content"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const singleImg = params.get('img');
const multiImgs = params.get('imgs');

const content = document.getElementById('content');

function decodeSafe(value){
  if(!value) return '';
  try{
    return decodeURIComponent(value);
  }catch(e){
    return value;
  }
}

function renderImages(urls){
  content.innerHTML = '';

  if(!urls.length){
    content.innerHTML = '<div class="empty">표시할 이미지가 없습니다.</div>';
    return;
  }

  urls.forEach((url, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'imageWrap';

    const label = document.createElement('div');
    label.className = 'pageLabel';
    label.textContent = `${index + 1} 페이지`;

    const img = document.createElement('img');
    img.src = url;
    img.alt = `${index + 1} 페이지`;

    img.addEventListener('dragstart', e => e.preventDefault());

    wrap.appendChild(label);
    wrap.appendChild(img);
    content.appendChild(wrap);
  });
}

if(multiImgs){
  const decoded = decodeSafe(multiImgs);
  const urls = decoded
    .split('|')
    .map(v => v.trim())
    .filter(Boolean);

  renderImages(urls);
}else if(singleImg){
  renderImages([decodeSafe(singleImg)]);
}else{
  renderImages([]);
}
</script>

</body>
</html>
