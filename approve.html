<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RVDH Approval</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
padding:24px;
}

.container{
max-width:760px;
margin:0 auto;
}

.card{
background:#1b1b1b;
border:1px solid #2a2a2a;
border-radius:28px;
padding:28px;
margin-bottom:24px;
}

.label{
font-size:13px;
color:#888;
margin-bottom:8px;
}

.value{
font-size:20px;
font-weight:500;
}

.amount{
font-size:34px;
font-weight:700;
margin-top:8px;
}

.status{
display:inline-flex;
align-items:center;
padding:10px 16px;
border-radius:999px;
background:#2b2b2b;
font-size:14px;
margin-top:20px;
}

.viewerGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:28px;
}

.viewerButton{
display:flex;
align-items:center;
justify-content:center;
height:60px;
border-radius:20px;
background:white;
color:black;
text-decoration:none;
font-weight:700;
font-size:16px;
}

textarea{
width:100%;
height:140px;
background:#111;
border:1px solid #333;
border-radius:20px;
padding:18px;
box-sizing:border-box;
color:white;
font-size:15px;
resize:none;
margin-top:16px;
}

.actionGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:24px;
}

button{
height:60px;
border:none;
border-radius:20px;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:0.2s;
}

button:disabled{
opacity:0.4;
cursor:not-allowed;
}

.approve{
background:white;
color:black;
}

.reject{
background:#ff4d4f;
color:white;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,0.75);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:9999;
}

.popupBox{
width:100%;
max-width:420px;
background:#1b1b1b;
border:1px solid #333;
border-radius:28px;
padding:28px;
}

.popupTitle{
font-size:24px;
font-weight:700;
margin-bottom:16px;
}

.popupDesc{
color:#aaa;
line-height:1.7;
margin-bottom:28px;
}

.popupButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.cancelBtn{
background:#2b2b2b;
color:white;
}

.confirmBtn{
background:white;
color:black;
}

@media(max-width:640px){

body{
padding:16px;
}

.viewerGrid{
grid-template-columns:1fr;
}

.actionGrid{
grid-template-columns:1fr;
}

.amount{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="label">
프로젝트명
</div>

<div class="value" id="projectName">
-
</div>

<br>

<div class="label">
업체명
</div>

<div class="value" id="vendorName">
-
</div>

<br>

<div class="label">
발주 금액
</div>

<div class="amount" id="amount">
-
</div>

<div class="status" id="status">
검토중
</div>

<div class="viewerGrid">

<a
id="orderButton"
class="viewerButton"
target="_blank"
>
발주서 보기
</a>

<a
id="specButton"
class="viewerButton"
target="_blank"
>
명세서 보기
</a>

</div>

</div>

<div class="card">

<div class="label">
메모 / 반려 사유
</div>

<textarea
id="comment"
placeholder="내용을 입력해주세요."
></textarea>

<div class="actionGrid">

<button
class="approve"
id="approveBtn"
>
승인하기
</button>

<button
class="reject"
id="rejectBtn"
>
반려하기
</button>

</div>

</div>

</div>

<div
class="popup"
id="confirmPopup"
>

<div class="popupBox">

<div class="popupTitle">
승인하시겠습니까?
</div>

<div class="popupDesc">
승인 완료 후에는 수정이 불가능합니다.<br><br>
문서 내용을 다시 한번 확인해주세요.
</div>

<div class="popupButtons">

<button
class="cancelBtn"
onclick="closePopup()"
>
취소
</button>

<button
class="confirmBtn"
onclick="confirmApproval()"
>
최종 승인
</button>

</div>

</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const approvalId =
params.get('id') || '';

const projectName =
decodeURIComponent(
params.get('project') || '-'
);

const vendorName =
decodeURIComponent(
params.get('vendor') || '-'
);

const amount =
decodeURIComponent(
params.get('amount') || '-'
);

const orderViewer =
decodeURIComponent(
params.get('order') || '#'
);

const specViewer =
decodeURIComponent(
params.get('spec') || '#'
);

document.getElementById('projectName').innerText =
projectName;

document.getElementById('vendorName').innerText =
vendorName;

document.getElementById('amount').innerText =
amount;

document.getElementById('orderButton').href =
orderViewer;

document.getElementById('specButton').href =
specViewer;

const popup =
document.getElementById('confirmPopup');

document.getElementById('approveBtn')
.addEventListener('click', () => {

popup.style.display = 'flex';

});

function closePopup(){

popup.style.display = 'none';

}

async function confirmApproval(){

popup.style.display = 'none';

await sendWebhook('approved');

}

document.getElementById('rejectBtn')
.addEventListener('click', async () => {

const ok =
confirm('반려 처리하시겠습니까?');

if(!ok) return;

await sendWebhook('rejected');

});

async function sendWebhook(status){

const approveBtn =
document.getElementById('approveBtn');

const rejectBtn =
document.getElementById('rejectBtn');

approveBtn.disabled = true;
rejectBtn.disabled = true;

try{

await fetch(
'https://hook.us1.make.com/REPLACE_WITH_YOUR_WEBHOOK',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({

id:approvalId,
status:status,
comment:
document.getElementById('comment').value

})
}
);

document.getElementById('status').innerText =
status === 'approved'
? '승인완료'
: '반려';

alert(
status === 'approved'
? '승인이 완료되었습니다.'
: '반려 처리되었습니다.'
);

}catch(error){

alert('오류가 발생했습니다.');

approveBtn.disabled = false;
rejectBtn.disabled = false;

}

}

</script>

</body>

</html>
