<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVDH Approval</title>

<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">

<style>
body{margin:0;background:#3B2A1D;color:white;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:24px;}
.container{max-width:760px;margin:0 auto;}
.logoWrap{display:flex;justify-content:center;align-items:center;margin:10px 0 34px;text-align:center;}
.logo{width:270px;height:auto;max-width:90%;object-fit:contain;}
.logoSubText{margin-top:10px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.58);font-weight:500;}
.card{background:#463426;border:1px solid rgba(255,255,255,0.12);border-radius:28px;padding:28px;margin-bottom:24px;box-shadow:0 20px 60px rgba(0,0,0,0.18);}
.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 18px;}
.infoFull{grid-column:1 / -1;}
.label{font-size:13px;color:rgba(255,255,255,0.58);margin-bottom:8px;}
.value{font-size:20px;font-weight:500;line-height:1.45;word-break:keep-all;}
.amount{font-size:34px;font-weight:700;margin-top:8px;}
.status{display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;background:#2F2118;font-size:14px;margin-top:24px;border:1px solid rgba(255,255,255,0.1);}
.viewerGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px;}
.viewerButton{display:flex;align-items:center;justify-content:center;height:60px;border-radius:20px;background:white;color:#2F2118;text-decoration:none;font-weight:700;font-size:16px;}
.viewerButton.disabled{opacity:.45;pointer-events:none;}
textarea{width:100%;height:140px;background:#2F2118;border:1px solid rgba(255,255,255,0.16);border-radius:20px;padding:18px;box-sizing:border-box;color:white;font-size:15px;resize:none;margin-top:16px;outline:none;line-height:1.6;}
textarea::placeholder{color:rgba(255,255,255,0.38);}
.actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;}
button{height:60px;border:none;border-radius:20px;font-size:17px;font-weight:700;cursor:pointer;transition:0.2s;}
button:disabled{opacity:0.4;cursor:not-allowed;}
.approve{background:white;color:#2F2118;}
.reject{background:#9E3E31;color:white;}
.popup{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999;}
.popupBox{width:100%;max-width:480px;background:#463426;border:1px solid rgba(255,255,255,0.14);border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,0.35);max-height:90vh;overflow:auto;}
.popupTitle{font-size:24px;font-weight:700;margin-bottom:16px;}
.popupDesc{color:rgba(255,255,255,0.68);line-height:1.7;margin-bottom:22px;}
.popupButtons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.cancelBtn{background:#2F2118;color:white;}
.confirmBtn{background:white;color:#2F2118;}
.confirmRejectBtn{background:#9E3E31;color:white;}
.signatureBox{background:#2F2118;border:1px solid rgba(255,255,255,0.18);border-radius:20px;padding:14px;margin-top:18px;}
.signatureLabel{font-size:13px;color:rgba(255,255,255,0.58);margin-bottom:10px;}
#signatureCanvas{width:100%;height:180px;background:#fff;border-radius:14px;touch-action:none;display:block;}
.signatureActions{display:flex;justify-content:flex-end;margin-top:10px;}
.clearSignBtn{height:42px;padding:0 16px;border-radius:14px;background:#2F2118;color:white;border:1px solid rgba(255,255,255,0.18);font-size:14px;}
.signatureError{color:#ffb3a8;font-size:14px;margin-top:10px;display:none;}
.passwordScreen{position:fixed;inset:0;background:#3B2A1D
