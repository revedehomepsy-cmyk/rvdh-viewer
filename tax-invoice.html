<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https://hook.eu1.make.com; base-uri 'none'; object-src 'none'; form-action 'self'">
  <title>RVDH 계산서 발급 관리</title>

  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">

  <style>
    body{
      margin:0;
      background:#3B2A1D;
      color:white;

    .container{

    }

    .logoWrap{

    .stepBadge{

      align-items:center;

      font-size:13px;

    .card{

    }

    .sectionDesc{

    .countBadge{

      align-items:center;
      padding:6px 12px;
      border-radius:999px;
      background:#9E3E31;

      font-weight:700;

    }

    /* 리스트 아이템 */
    .listItem{
      display:flex;
      align-items:center;

      background:#2F2118;

    .listItem:hover{

    .listItemLeft{

      align-items:center;

    .liVendor{

    }

    .liDivider{

    }

    .liAmount{

      font-weight:700;

    }

    .liRequester{

    .reqBtn{

    /* 요청 안내문 모달 */
    .reqModal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      display:none;
      align-items:center;

    .reqModalBox{

    .reqModalTitle{

    }

    .reqText{
      width:100%;
      height:340px;

    .reqModalButtons{

    .amount{

    .fileInputBox{
      background:#2F2118;

      border:1px solid rgba(255,255,255,.12);

    }

    .passwordTitle{

    }

    .passwordDesc{

    .passwordInput{
      width:100%;
      height:58px;

      border:1px solid rgba(255,255,255,.18);

      font-size:22px;

<body>

  <!-- 계산서 요청 안내문 모달 -->
  <div class="reqModal" id="requestModal">

  <script>
    /* =========================================================
       설정 — Make 웹훅 2개 URL을 여기에 넣으세요.
       1) LIST_WEBHOOK_URL  : 미발급(확인필요) 목록을 돌려주는 웹훅
       2) SUBMIT_WEBHOOK_URL: 첨부 제출 → 노션 상태변경 + 파일업로드 웹훅
       ========================================================= */
    const ACCESS_PASSWORD_HASH = '41177165eddb7d6d754a4f8e6f9758cf06f052c1b2448bd9b5e5e292ce38ea74';

    async function sha256Hex(text){
      const data = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const LIST_WEBHOOK_URL   = 'https://hook.eu1.make.com/73zjq3dminwvb4yk9y8ltj9j43lt293r';
    const SUBMIT_WEBHOOK_URL = 'https://hook.eu1.make.com/8uvmh9oifw1j2epn06nqbhoc51d6pcht';

    // 목록/제출 웹훅 인증용 공유 키 (Make 시나리오 앞단 필터에서 대조)
    const WEBHOOK_ACCESS_KEY = 'rvdh_99ddf784a9b87bedb074ea4d5a1894ee';

    /* ---------- 공통 유틸 ---------- */
    function formatAmount(value){
      if(value === null || value === undefined || value === '' || value === '-') return '-';
      const numberOnly = String(value).replace(/[^\d.-]/g, '');
      const number = Number(numberOnly);
      if(isNaN(number)) return String(value);
      return number.toLocaleString('ko-KR') + '원';
    }

    function pick(obj, keys, fallback = ''){
      for(const k of keys){
        if(obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
      }
      return fallback;
    }

    // 웹훅 응답을 표준 형태로 변환 (필드명이 달라도 최대한 매핑)
    function normalizeItem(raw){
      return {
        id:        pick(raw, ['id','ID','userDefined:ID','notionId','pageId'], ''),
        vendor:    pick(raw, ['vendor','업체명','companyName','company','name'], '-'),
        amount:    pick(raw, ['amount','청구금액','price','금액'], ''),
        requester: pick(raw, ['requester','발주자','manager','orderer'], '-'),
        detail:    pick(raw, ['detail','내역','description','desc'], '-'),
        notionId:  pick(raw, ['notionId','pageId','notion_page_id','notionItemId'], ''),
        billDate:  pick(raw, ['billDate','청구날짜','billdate','date','청구일'], '')
      };
    }

    // 날짜 표시용: ISO/날짜 문자열 → YYYY-MM-DD (시간 제거)
    function formatDate(value){
      if(!value) return '-';
      const s = String(value).trim();
      const d = new Date(s);
      if(!isNaN(d.getTime())){
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return y + '-' + m + '-' + day;
      }
      // 파싱 안 되면 앞 10글자(YYYY-MM-DD)만이라도
      return s.slice(0,10) || '-';
    }

    // 청구날짜 → YYYYMMDD (없으면 오늘)
    function compactDate(value){
      const f = formatDate(value);
      if(f && f !== '-') return f.replace(/-/g, '');
      const d = new Date();
      return '' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    }

    // 파일명 금지문자 제거 + 정리
    function sanitizeForFilename(s){
      return String(s == null ? '' : s)
        .replace(/[\/\\:*?"<>|]/g, '')   // 윈도우/OneDrive 금지문자
        .replace(/[\r\n\t]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getExt(name){
      const m = String(name || '').match(/\.([A-Za-z0-9]+)$/);
      return m ? m[1].toLowerCase() : '';
    }

    // YYYYMMDD_업체명_금액_내역_발주자.확장자
    function buildFileName(item, originalName){
      const dateStr = compactDate(item.billDate);
      const vendor = sanitizeForFilename(item.vendor);
      const amount = String(item.amount || '').replace(/[^\d]/g, '');   // 숫자만
      const detail = sanitizeForFilename(item.detail).slice(0, 40);     // 너무 길면 자름
      const requester = sanitizeForFilename(item.requester);
      const ext = getExt(originalName);

      let base = [dateStr, vendor, amount, detail, requester]
        .filter(function(v){ return v !== ''; })
        .join('_');

      if(!base) base = 'file';
      return ext ? (base + '.' + ext) : base;
    }

    let currentItems = [];
    let selectedItem = null;

    /* ---------- 목록 불러오기 ---------- */
    async function loadList(){
      const container = document.getElementById('listContainer');
      const countBadge = document.getElementById('countBadge');
      countBadge.style.display = 'none';
      container.innerHTML = '<div class="stateText" id="listLoading">목록을 불러오는 중입니다…</div>';

      if(LIST_WEBHOOK_URL.includes('계산서목록조회_WEBHOOK_URL')){
        container.innerHTML = '<div class="stateText">⚠️ 목록 조회 웹훅(LIST_WEBHOOK_URL)이 아직 설정되지 않았습니다.<br>코드 상단에 Make 웹훅 URL을 입력해주세요.</div>';
        return;
      }

      let rawText = '';
      try{
        const response = await fetch(LIST_WEBHOOK_URL, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body:JSON.stringify({ type:'taxInvoiceList', key: WEBHOOK_ACCESS_KEY })
        });

        // 원문 텍스트를 먼저 받아서 디버깅 + 깨진 JSON 복구
        rawText = await response.text();
        console.log('[목록 웹훅 status]', response.status);
        console.log('[목록 웹훅 응답 원문]', rawText);

        if(!response.ok){
          throw new Error('웹훅 오류 status ' + response.status);
        }

        if(!rawText || !rawText.trim()){
          throw new Error('빈 응답 — 시나리오가 켜져 있는지 확인하세요');
        }

        if(rawText.trim() === 'Accepted'){
          throw new Error('Accepted 응답 — Make 시나리오가 꺼져 있습니다. 좌측 하단 토글을 ON 하세요');
        }

        let rawItems;
        try{
          const data = parseLooseJson(rawText);
          rawItems = Array.isArray(data) ? data : (data.items || data.results || data.data || []);
        }catch(parseErr){
          // 정식 JSON 파싱 실패 시 → 고정 키 구조로 직접 추출 (값에 따옴표/콤마가 있어도 안전)
          console.warn('JSON 파싱 실패, 키 기반 추출로 대체:', parseErr);
          rawItems = parseByKnownKeys(rawText);
          if(!rawItems.length) throw parseErr;
        }

        currentItems = rawItems.map(normalizeItem);

        renderList();
      }catch(error){
        console.error('[목록 불러오기 실패]', error, '원문:', rawText);
        const snippet = rawText ? rawText.slice(0,160) : '(빈 응답)';
        container.innerHTML = '';
        const errBox = document.createElement('div');
        errBox.className = 'stateText';
        const errLine1 = document.createElement('div');
        errLine1.textContent = '목록을 불러오지 못했습니다.';
        const errLine2 = document.createElement('span');
        errLine2.style.cssText = 'font-size:12px;opacity:.7;display:block;';
        errLine2.textContent = '원인: ' + (error.message || error);
        const errLine3 = document.createElement('span');
        errLine3.style.cssText = 'font-size:11px;opacity:.55;display:block;margin-top:8px;word-break:break-all;';
        errLine3.textContent = '응답: ' + snippet;
        errBox.appendChild(errLine1);
        errBox.appendChild(errLine2);
        errBox.appendChild(errLine3);
        container.appendChild(errBox);
      }
    }

    // 깨진 JSON도 최대한 복구해서 파싱 (콤마 누락 }{, 줄바꿈 등)
    function parseLooseJson(text){
      let t = String(text).trim();

      try{ return JSON.parse(t); }catch(e){}

      // 문자열 내부 줄바꿈/탭 → 공백 (내역에 줄바꿈이 있으면 JSON이 깨짐)
      let cleaned = t.replace(/[\r\n\t]+/g, ' ');
      try{ return JSON.parse(cleaned); }catch(e){}

      // 객체 사이 콤마 누락 복구:  }{  →  },{
      let repaired = cleaned.replace(/\}\s*\{/g, '},{');
      try{ return JSON.parse(repaired); }catch(e){}

      // items 배열만 들어온 경우 등 한 번 더 시도
      try{ return JSON.parse('[' + repaired + ']'); }catch(e){}

      throw new Error('JSON 파싱 실패 (응답 형식 확인 필요)');
    }

    // 고정 키 순서(id,vendor,amount,requester,detail,notionId) 기반 추출.
    // 값 안에 따옴표/콤마/줄바꿈이 있어도 안전하게 읽음.
    function parseByKnownKeys(text){
      const items = [];
      const re = /"id":"([\s\S]*?)","vendor":"([\s\S]*?)","amount":"([\s\S]*?)","requester":"([\s\S]*?)","detail":"([\s\S]*?)","notionId":"([\s\S]*?)"(?:,"billDate":"([\s\S]*?)")?\s*\}/g;
      let m;
      while((m = re.exec(text)) !== null){
        items.push({
          id: m[1],
          vendor: m[2],
          amount: m[3],
          requester: m[4],
          detail: m[5],
          notionId: m[6],
          billDate: m[7] || ''
        });
      }
      return items;
    }

    function renderList(){
      const container = document.getElementById('listContainer');
      const countBadge = document.getElementById('countBadge');
      const searchEl = document.getElementById('searchInput');
      const term = (searchEl ? searchEl.value : '').trim().toLowerCase();

      if(!currentItems.length){
        countBadge.style.display = 'none';
        container.innerHTML = '<div class="stateText">미발급(확인필요) 항목이 없습니다. 🎉</div>';
        return;
      }

      // 발주자 이름으로 필터
      const filtered = term
        ? currentItems.filter(function(it){
            return String(it.requester || '').toLowerCase().includes(term);
          })
        : currentItems;

      countBadge.style.display = 'inline-flex';
      countBadge.innerText = filtered.length;

      if(!filtered.length){
        container.innerHTML = '';
        const noRes = document.createElement('div');
        noRes.className = 'stateText';
        noRes.textContent = '“' + term + '” 발주자 검색 결과가 없습니다.';
        container.appendChild(noRes);
        return;
      }

      container.innerHTML = '';
      filtered.forEach(function(item){
        const el = document.createElement('div');
        el.className = 'listItem';
        el.innerHTML =
          '<div class="listItemLeft">' +
            '<span class="liVendor"></span>' +
            '<span class="liDivider">|</span>' +
            '<span class="liAmount"></span>' +
          '</div>' +
          '<div class="liRequester"></div>' +
          '<button type="button" class="reqBtn">계산서 요청</button>' +
          '<button type="button" class="proofBtn">증빙하기</button>';

        el.querySelector('.liVendor').innerText = item.vendor || '-';
        el.querySelector('.liAmount').innerText = formatAmount(item.amount);
        el.querySelector('.liRequester').innerText = '발주자 ' + (item.requester || '-');

        // 계산서 요청 → 모달 (행 클릭 막기)
        el.querySelector('.reqBtn').addEventListener('click', function(e){
          e.stopPropagation();
          openRequestModal(item);
        });

        // 증빙하기 → 상세
        el.querySelector('.proofBtn').addEventListener('click', function(e){
          e.stopPropagation();
          openDetail(item);
        });

        el.addEventListener('click', function(){ openDetail(item); });
        container.appendChild(el);
      });
    }

    /* ---------- 상세 ---------- */
    function openDetail(item){
      selectedItem = item;

      document.getElementById('dID').innerText        = selectedItem.id || '-';
      document.getElementById('dVendor').innerText    = selectedItem.vendor || '-';
      document.getElementById('dRequester').innerText = selectedItem.requester || '-';
      document.getElementById('dBillDate').innerText  = formatDate(selectedItem.billDate);
      document.getElementById('dDetail').innerText    = selectedItem.detail || '-';
      document.getElementById('dAmount').innerText    = formatAmount(selectedItem.amount);

      document.getElementById('proofFile').value = '';
      document.getElementById('submitStatus').innerText = '';
      document.getElementById('submitBtn').disabled = false;

      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function backToList(){
      selectedItem = null;
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
      window.scrollTo(0, 0);
    }

    /* ---------- 계산서 요청 모달 ---------- */
    function buildRequestText(item){
      const vendor = item.vendor && item.vendor !== '-' ? item.vendor : '';
      const amount = formatAmount(item.amount);
      const billDate = formatDate(item.billDate);
      const requester = item.requester && item.requester !== '-' ? item.requester : '';

      return [
        '안녕하세요.',
        vendor + ' 담당자님',
        '',
        '현재 전자 세금계산서 또는 전자 현금영수증 발급이 안된 상태입니다.',
        '',
        '원활한 세무 증빙을 위하여 하기 금액에 맞는 계산서 또는 영수증 발급 부탁드립니다.',
        '',
        '입금처 : 두이에아우어(주)',
        '사업자 번호 : 806-86-023-03',
        '이메일 : invoice@revedehome.kr',
        '',
        '금액 : ' + amount,
        '구매날짜 : ' + billDate,
        '구매자 담당자 : ' + requester,
        '',
        '감사합니다.'
      ].join('\n');
    }

    function openRequestModal(item){
      document.getElementById('reqText').value = buildRequestText(item);
      document.getElementById('requestModal').style.display = 'flex';
    }

    function closeRequestModal(){
      document.getElementById('requestModal').style.display = 'none';
    }

    async function shareRequest(){
      const text = document.getElementById('reqText').value;

      if(navigator.share){
        try{
          await navigator.share({ text: text });
        }catch(e){
          // 사용자가 취소한 경우 등은 무시
        }
      }else{
        // 공유 미지원(주로 PC) → 클립보드 복사로 대체
        await copyRequest();
        alert('이 환경은 바로 공유를 지원하지 않아 안내문을 복사했습니다.\n카카오톡 등에 붙여넣어 전달해주세요.');
      }
    }

    async function copyRequest(){
      const text = document.getElementById('reqText').value;
      try{
        await navigator.clipboard.writeText(text);
        alert('안내문이 복사되었습니다.');
      }catch(e){
        // 클립보드 API 미지원 → 텍스트 영역 선택
        const ta = document.getElementById('reqText');
        ta.focus();
        ta.select();
        try{ document.execCommand('copy'); alert('안내문이 복사되었습니다.'); }catch(e2){}
      }
    }

    /* ---------- 제출 ---------- */
    async function submitProof(){
      if(!selectedItem){ return; }

      const fileInput = document.getElementById('proofFile');
      const statusEl = document.getElementById('submitStatus');
      const submitBtn = document.getElementById('submitBtn');

      const file = fileInput.files[0];

      if(!file){
        statusEl.innerText = '첨부할 계산서/현금영수증 파일을 선택해주세요.';
        return;
      }

      if(SUBMIT_WEBHOOK_URL.includes('계산서발급제출_WEBHOOK_URL')){
        statusEl.innerText = '⚠️ 제출 웹훅(SUBMIT_WEBHOOK_URL)이 아직 설정되지 않았습니다.';
        return;
      }

      // 파일명 조립: YYYYMMDD_업체명_금액_내역_발주자.확장자
      const newFileName = buildFileName(selectedItem, file.name);

      const formData = new FormData();
      formData.append('type', 'taxInvoiceSubmit');
      formData.append('key', WEBHOOK_ACCESS_KEY);
      formData.append('id', selectedItem.id);
      formData.append('notionId', selectedItem.notionId || '');
      formData.append('vendor', selectedItem.vendor);
      formData.append('amount', String(selectedItem.amount));
      formData.append('requester', selectedItem.requester);
      formData.append('detail', selectedItem.detail || '');
      formData.append('billDate', selectedItem.billDate || '');
      formData.append('fileName', newFileName);          // 조립된 새 파일명
      formData.append('originalFileName', file.name);     // 원본 파일명(참고용)
      formData.append('fileSize', String(file.size));
      formData.append('submittedAt', new Date().toISOString());
      formData.append('file', file);

      submitBtn.disabled = true;
      statusEl.innerText = '제출 중입니다. 잠시만 기다려주세요…';

      try{
        const response = await fetch(SUBMIT_WEBHOOK_URL, {
          method:'POST',
          body:formData
        });

        if(!response.ok) throw new Error('submit webhook failed: ' + response.status);

        statusEl.innerText = '✅ 제출 완료 — 발급완료로 변경되고 계산서가 업로드되었습니다.';

        // 처리된 항목은 목록에서 제거
        currentItems = currentItems.filter(function(it){ return it.id !== selectedItem.id; });

        setTimeout(function(){
          renderList();
          backToList();
        }, 1200);

      }catch(error){
        console.error(error);
        statusEl.innerText = '제출 중 오류가 발생했습니다. 다시 시도해주세요.';
        submitBtn.disabled = false;
      }
    }

    /* ---------- 비밀번호 ---------- */
    function unlockPage(){
      document.getElementById('passwordScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      loadList();
    }

    async function checkPassword(){
      const input = document.getElementById('passwordInput').value;

      let inputHash = '';

      try{
        inputHash = await sha256Hex(input);
      }catch(e){
        console.error('해시 계산 실패:', e);
      }

      if(inputHash === ACCESS_PASSWORD_HASH){
        sessionStorage.setItem('rvdh_taxinvoice_unlocked', 'true');
        unlockPage();
      }else{
        document.getElementById('passwordError').style.display = 'block';
      }
    }

    document.getElementById('passwordBtn').addEventListener('click', checkPassword);
    document.getElementById('passwordInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter') checkPassword();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadList);
    document.getElementById('searchInput').addEventListener('input', renderList);
    document.getElementById('reqShareBtn').addEventListener('click', shareRequest);
    document.getElementById('reqCopyBtn').addEventListener('click', copyRequest);
    document.getElementById('reqCloseBtn').addEventListener('click', closeRequestModal);
    document.getElementById('requestModal').addEventListener('click', function(e){
      if(e.target === this) closeRequestModal();
    });
    document.getElementById('backBtn').addEventListener('click', backToList);
    document.getElementById('submitBtn').addEventListener('click', submitProof);

    window.addEventListener('load', function(){
      const pw = document.getElementById('passwordInput');
      if(pw) setTimeout(function(){ pw.focus(); }, 300);
    });

    // 같은 세션에서 이미 비밀번호 통과했으면 바로 열기
    if(sessionStorage.getItem('rvdh_taxinvoice_unlocked') === 'true'){
      unlockPage();
    }
  </script>
</body>
