<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; base-uri 'none'; object-src 'none'; form-action 'self'">
<title>RVDH Viewer</title>

<style>
body{
  margin:0;
  background:#2f2118;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  padding:24px;
}

.viewer{
  max-width:900px;
  margin:0 auto;
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.title{
  font-size:18px;
  font-weight:700;
  letter-spacing:.08em;
  opacity:.8;
}

.subTitle{
  margin-top:8px;
  font-size:13px;
  color:rgba(255,255,255,.55);
}

.imageWrap{
  margin-bottom:24px;
  background:#463426;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:12px;
}

.imageInner{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  background:white;
}

.imageWrap img{
  display:block;
  width:100%;
  height:auto;
  border-radius:12px;
  background:white;
  pointer-events:none;
  -webkit-user-drag:none;
  user-select:none;
}

.watermarkLayer{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  background-repeat:repeat;
  opacity:.11;
  mix-blend-mode:multiply;
}

.fileWrap{
  margin-bottom:16px;
  background:#463426;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:18px;
}

.fileTitle{
  font-size:14px;
  color:rgba(255,255,255,.65);
  margin-bottom:12px;
}

.fileButton{
  display:flex;
  align-items:center;
  justify-content:center;
  height:58px;
  border-radius:16px;
  background:white;
  color:#2f2118;
  text-decoration:none;
  font-weight:700;
  font-size:16px;
}

.fileButton:hover{
  opacity:.9;
}

.pageLabel{
  font-size:13px;
  color:rgba(255,255,255,.6);
  margin:0 0 10px 4px;
}

.notice{
  font-size:13px;
  color:rgba(255,255,255,.55);
  line-height:1.6;
  margin-top:10px;
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:rgba(255,255,255,.65);
}

@media(max-width:640px){
  body{
    padding:16px;
  }

  .viewer{
    max-width:100%;
  }

  .fileWrap{
    padding:14px;
    border-radius:16px;
  }

  .imageWrap{
    padding:10px;
    border-radius:16px;
  }
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="viewer">
  <div class="header">
    <div class="title">RVDH DOCUMENT VIEWER</div>
    <div class="subTitle">Document List</div>
  </div>

  <div id="content"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const singleImg = params.get('img');
const multiImgs = params.get('imgs');
const mixedItems = params.get('items');
const watermarkText = decodeSafe(params.get('watermark') || '');

const content = document.getElementById('content');

function decodeSafe(value){
  if(!value) return '';

  let result = value;

  for(let i = 0; i < 3; i++){
    try{
      const decoded = decodeURIComponent(result);
      if(decoded === result) break;
      result = decoded;
    }catch(e){
      break;
    }
  }

  return result;
}

function renderEmpty(){
  content.innerHTML = '<div class="empty">표시할 문서가 없습니다.</div>';
}

const ALLOWED_HOST_SUFFIXES = [
  'amazonaws.com',
  'notion.so',
  'notion.site',
  'notion-static.com',
  'sharepoint.com',
  '1drv.ms',
  'github.io',
  'make.com',
  'cloudinary.com'
];

function isSafeHttpUrl(rawUrl){
  try{
    const parsed = new URL(rawUrl);

    if(parsed.protocol !== 'https:') return false;

    const host = parsed.hostname.toLowerCase();

    return ALLOWED_HOST_SUFFIXES.some(function(suffix){
      return host === suffix || host.endsWith('.' + suffix);
    });
  }catch(e){
    return false;
  }
}

function sanitizeUrl(url){
  const cleanUrl = decodeSafe(url || '').trim();

  if(!cleanUrl) return '';

  if(cleanUrl === '[object Object]' || cleanUrl.includes('[object Object]')){
    return '';
  }

  if(!isSafeHttpUrl(cleanUrl)){
    console.warn('차단된 URL(비허용 프로토콜/도메인):', cleanUrl);
    return '';
  }

  return cleanUrl;
}

function createWatermarkDataUrl(text){
  if(!text) return '';

  const canvas = document.createElement('canvas');
  canvas.width = 200;
  canvas.height = 118;

  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(100, 63);
  ctx.rotate(-28 * Math.PI / 180);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '700 22px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif';
  ctx.fillStyle = 'rgba(80, 58, 42, 0.42)';
  ctx.fillText(text, 0, -8);

  ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif';
  ctx.fillStyle = 'rgba(80, 58, 42, 0.30)';
  ctx.fillText('RVDH CONFIDENTIAL', 0, 18);

  ctx.restore();

  return canvas.toDataURL('image/png');
}

const watermarkDataUrl = createWatermarkDataUrl(watermarkText);

function appendWatermarkLayer(parent){
  if(!watermarkDataUrl) return;

  const layer = document.createElement('div');
  layer.className = 'watermarkLayer';
  layer.style.backgroundImage = `url("${watermarkDataUrl}")`;

  parent.appendChild(layer);
}

function createImageBlock(url, index){
  const cleanUrl = sanitizeUrl(url);

  const wrap = document.createElement('div');
  wrap.className = 'imageWrap';

  const label = document.createElement('div');
  label.className = 'pageLabel';
  label.textContent = `${index + 1} 페이지`;

  const inner = document.createElement('div');
  inner.className = 'imageInner';

  const img = document.createElement('img');
  img.src = cleanUrl;
  img.alt = `${index + 1} 페이지`;

  img.addEventListener('dragstart', e => e.preventDefault());

  img.onerror = function(){
    wrap.innerHTML = '';

    const title = document.createElement('div');
    title.className = 'fileTitle';
    title.textContent = `${index + 1}번 첨부파일`;

    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.textContent = '이미지를 불러오지 못했습니다. 아래 버튼으로 확인해주세요.';

    const button = document.createElement('a');
    button.className = 'fileButton';
    button.href = cleanUrl;
    button.target = '_blank';
    button.rel = 'noopener noreferrer';
    button.textContent = '파일 보기';

    wrap.className = 'fileWrap';
    wrap.appendChild(title);
    wrap.appendChild(button);
    wrap.appendChild(notice);
  };

  inner.appendChild(img);
  appendWatermarkLayer(inner);

  wrap.appendChild(label);
  wrap.appendChild(inner);

  return wrap;
}

function renderImages(urls){
  content.innerHTML = '';

  const cleanUrls = urls
    .map(v => sanitizeUrl(v))
    .filter(Boolean);

  if(!cleanUrls.length){
    renderEmpty();
    return;
  }

  cleanUrls.forEach((url, index) => {
    content.appendChild(createImageBlock(url, index));
  });
}

function renderItems(items){
  content.innerHTML = '';

  const cleanItems = items
    .map(v => v.trim())
    .filter(Boolean);

  if(!cleanItems.length){
    renderEmpty();
    return;
  }

  cleanItems.forEach((item, index) => {
    const separatorIndex = item.indexOf('::');

    let type = 'link';
    let url = item;

    if(separatorIndex > -1){
      type = item.slice(0, separatorIndex).trim().toLowerCase();
      url = item.slice(separatorIndex + 2).trim();
    }

    url = sanitizeUrl(url);

    if(!url) return;

    if(type === 'image' || type === 'img'){
      content.appendChild(createImageBlock(url, index));
      return;
    }

    const wrap = document.createElement('div');
    wrap.className = 'fileWrap';

    const title = document.createElement('div');
    title.className = 'fileTitle';

    if(type === 'pdf'){
      title.textContent = `${index + 1}번 PDF 문서`;
    }else{
      title.textContent = `${index + 1}번 첨부파일`;
    }

    const button = document.createElement('a');
    button.className = 'fileButton';
    button.href = url;
    button.target = '_blank';
    button.rel = 'noopener noreferrer';
    button.textContent = '파일 보기';

    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.textContent = '파일은 새 창에서 열립니다.';

    wrap.appendChild(title);
    wrap.appendChild(button);
    wrap.appendChild(notice);
    content.appendChild(wrap);
  });

  if(!content.children.length){
    renderEmpty();
  }
}

if(mixedItems){
  const decoded = decodeSafe(mixedItems);
  const items = decoded.split('|');

  renderItems(items);
}else if(multiImgs){
  const decoded = decodeSafe(multiImgs);
  const urls = decoded.split('|');

  renderImages(urls);
}else if(singleImg){
  renderImages([decodeSafe(singleImg)]);
}else{
  renderEmpty();
}
</script>

</body>
</html>
