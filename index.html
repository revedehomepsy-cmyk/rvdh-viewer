<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVDH Viewer</title>

<style>
body{
  margin:0;
  background:#2f2118;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  padding:24px;
}

.viewer{
  max-width:900px;
  margin:0 auto;
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.title{
  font-size:18px;
  font-weight:700;
  letter-spacing:.08em;
  opacity:.8;
}

.subTitle{
  margin-top:8px;
  font-size:13px;
  color:rgba(255,255,255,.55);
}

.imageWrap{
  margin-bottom:24px;
  background:#463426;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:12px;
}

.imageWrap img{
  display:block;
  width:100%;
  height:auto;
  border-radius:12px;
  background:white;
  pointer-events:none;
  -webkit-user-drag:none;
  user-select:none;
}

.fileWrap{
  margin-bottom:16px;
  background:#463426;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:18px;
}

.fileTitle{
  font-size:14px;
  color:rgba(255,255,255,.65);
  margin-bottom:12px;
}

.fileButton{
  display:flex;
  align-items:center;
  justify-content:center;
  height:58px;
  border-radius:16px;
  background:white;
  color:#2f2118;
  text-decoration:none;
  font-weight:700;
  font-size:16px;
}

.fileButton:hover{
  opacity:.9;
}

.pageLabel{
  font-size:13px;
  color:rgba(255,255,255,.6);
  margin:0 0 10px 4px;
}

.notice{
  font-size:13px;
  color:rgba(255,255,255,.55);
  line-height:1.6;
  margin-top:10px;
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:rgba(255,255,255,.65);
}

@media(max-width:640px){
  body{
    padding:16px;
  }

  .viewer{
    max-width:100%;
  }

  .fileWrap{
    padding:14px;
    border-radius:16px;
  }

  .imageWrap{
    padding:10px;
    border-radius:16px;
  }
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="viewer">
  <div class="header">
    <div class="title">RVDH DOCUMENT VIEWER</div>
    <div class="subTitle">Document List</div>
  </div>

  <div id="content"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const singleImg = params.get('img');
const multiImgs = params.get('imgs');
const mixedItems = params.get('items');

const content = document.getElementById('content');

function decodeSafe(value){
  if(!value) return '';

  let result = value;

  for(let i = 0; i < 3; i++){
    try{
      const decoded = decodeURIComponent(result);
      if(decoded === result) break;
      result = decoded;
    }catch(e){
      break;
    }
  }

  return result;
}

function renderEmpty(){
  content.innerHTML = '<div class="empty">표시할 문서가 없습니다.</div>';
}

function renderImages(urls){
  content.innerHTML = '';

  const cleanUrls = urls
    .map(v => v.trim())
    .filter(Boolean);

  if(!cleanUrls.length){
    renderEmpty();
    return;
  }

  cleanUrls.forEach((url, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'imageWrap';

    const label = document.createElement('div');
    label.className = 'pageLabel';
    label.textContent = `${index + 1} 페이지`;

    const img = document.createElement('img');
    img.src = url;
    img.alt = `${index + 1} 페이지`;

    img.addEventListener('dragstart', e => e.preventDefault());

    img.onerror = function(){
      wrap.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'fileTitle';
      title.textContent = `${index + 1}번 첨부파일`;

      const notice = document.createElement('div');
      notice.className = 'notice';
      notice.textContent = '이미지를 불러오지 못했습니다. 아래 버튼으로 확인해주세요.';

      const button = document.createElement('a');
      button.className = 'fileButton';
      button.href = url;
      button.target = '_blank';
      button.rel = 'noopener noreferrer';
      button.textContent = '파일 보기';

      wrap.className = 'fileWrap';
      wrap.appendChild(title);
      wrap.appendChild(button);
      wrap.appendChild(notice);
    };

    wrap.appendChild(label);
    wrap.appendChild(img);
    content.appendChild(wrap);
  });
}

function renderItems(items){
  content.innerHTML = '';

  const cleanItems = items
    .map(v => v.trim())
    .filter(Boolean);

  if(!cleanItems.length){
    renderEmpty();
    return;
  }

  cleanItems.forEach((item, index) => {
    const separatorIndex = item.indexOf('::');

    let type = 'link';
    let url = item;

    if(separatorIndex > -1){
      type = item.slice(0, separatorIndex).trim().toLowerCase();
      url = item.slice(separatorIndex + 2).trim();
    }

    if(!url) return;

    if(type === 'image' || type === 'img'){
      const wrap = document.createElement('div');
      wrap.className = 'imageWrap';

      const label = document.createElement('div');
      label.className = 'pageLabel';
      label.textContent = `${index + 1} 페이지`;

      const img = document.createElement('img');
      img.src = url;
      img.alt = `${index + 1} 페이지`;

      img.addEventListener('dragstart', e => e.preventDefault());

      img.onerror = function(){
        wrap.innerHTML = '';

        const title = document.createElement('div');
        title.className = 'fileTitle';
        title.textContent = `${index + 1}번 첨부파일`;

        const notice = document.createElement('div');
        notice.className = 'notice';
        notice.textContent = '이미지를 불러오지 못했습니다. 아래 버튼으로 확인해주세요.';

        const button = document.createElement('a');
        button.className = 'fileButton';
        button.href = url;
        button.target = '_blank';
        button.rel = 'noopener noreferrer';
        button.textContent = '파일 보기';

        wrap.className = 'fileWrap';
        wrap.appendChild(title);
        wrap.appendChild(button);
        wrap.appendChild(notice);
      };

      wrap.appendChild(label);
      wrap.appendChild(img);
      content.appendChild(wrap);
      return;
    }

    const wrap = document.createElement('div');
    wrap.className = 'fileWrap';

    const title = document.createElement('div');
    title.className = 'fileTitle';

    if(type === 'pdf'){
      title.textContent = `${index + 1}번 PDF 문서`;
    }else{
      title.textContent = `${index + 1}번 첨부파일`;
    }

    const button = document.createElement('a');
    button.className = 'fileButton';
    button.href = url;
    button.target = '_blank';
    button.rel = 'noopener noreferrer';
    button.textContent = '파일 보기';

    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.textContent = '파일은 새 창에서 열립니다.';

    wrap.appendChild(title);
    wrap.appendChild(button);
    wrap.appendChild(notice);
    content.appendChild(wrap);
  });

  if(!content.children.length){
    renderEmpty();
  }
}

if(mixedItems){
  const decoded = decodeSafe(mixedItems);
  const items = decoded.split('|');

  renderItems(items);
}else if(multiImgs){
  const decoded = decodeSafe(multiImgs);
  const urls = decoded.split('|');

  renderImages(urls);
}else if(singleImg){
  renderImages([decodeSafe(singleImg)]);
}else{
  renderEmpty();
}
</script>

</body>
</html>
