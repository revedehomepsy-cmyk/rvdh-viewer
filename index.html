<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

img{
max-width:95vw;
max-height:95vh;
pointer-events:none;
user-select:none;
-webkit-user-drag:none;
}

.watermark{
position:fixed;
top:20px;
left:20px;
color:rgba(255,255,255,0.2);
font-size:24px;
font-weight:bold;
z-index:9999;
}

</style>
</head>

<body oncontextmenu="return false">

<div class="watermark">
RVDH INTERNAL<br>
외부 공유 금지
</div>

<img id="mainImage">

<script>

const params = new URLSearchParams(window.location.search);

const imageUrl = decodeURIComponent(params.get('img'));

document.getElementById('mainImage').src = imageUrl;

</script>

</body>
</html>
